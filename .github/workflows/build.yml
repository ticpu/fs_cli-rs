name: Build and Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Cross-compile all targets
      run: ./build.sh

    - name: Test binary
      run: |
        chmod +x dist/fs_cli.amd64
        version_output=$(./dist/fs_cli.amd64 --version 2>&1)
        echo "Version output: $version_output"
        if [[ "$version_output" != *"fs_cli-rs"* ]]; then
          echo "Binary version test failed"
          exit 1
        fi
        help_output=$(./dist/fs_cli.amd64 --help 2>&1)
        if [[ "$help_output" != *"FreeSWITCH"* || "$help_output" != *"Usage:"* ]]; then
          echo "Binary help test failed"
          exit 1
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: fs_cli-binaries
        path: dist/
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    # Full history: the Makefile derives the package version from the tag.
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download binaries
      uses: actions/download-artifact@v8
      with:
        name: fs_cli-binaries
        path: dist

    - name: Extract version from tag
      id: version
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Check tag matches Cargo.toml version
      run: |
        version=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
        if [ "$GITHUB_REF_NAME" != "v$version" ]; then
          echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
          exit 1
        fi

    - name: Build .deb packages
      run: |
        # The artifact loses mtimes, so make would otherwise rebuild the binaries
        touch dist/*
        make deb

    - name: Prepare release assets
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        mkdir assets
        mv dist/fs_cli.amd64 "assets/fs_cli_${VERSION}_amd64.debian-compatible"
        mv dist/fs_cli.arm64 "assets/fs_cli_${VERSION}_arm64.debian-compatible"
        mv dist/fs_cli.exe "assets/fs_cli_${VERSION}_amd64.windows.exe"
        mv ./*.deb assets/
        cd assets
        sha256sum fs_cli_* ./*.deb > SHA256SUMS

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: assets/*
        draft: false
        prerelease: false
        generate_release_notes: false
        name: "FreeSWITCH CLI ${{ github.ref_name }}"
        body: |
          FreeSWITCH CLI client built for multiple platforms.

          **Available Downloads:**
          - **Linux AMD64**: `fs_cli_${{ steps.version.outputs.version }}_amd64.debian-compatible` (built on Debian Bullseye for broad compatibility)
          - **Linux ARM64**: `fs_cli_${{ steps.version.outputs.version }}_arm64.debian-compatible`
          - **Windows AMD64**: `fs_cli_${{ steps.version.outputs.version }}_amd64.windows.exe`

          **Linux Installation:**
          ```bash
          # For AMD64 (x86_64)
          wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/fs_cli_${{ steps.version.outputs.version }}_amd64.debian-compatible
          sudo install -m0755 fs_cli_${{ steps.version.outputs.version }}_amd64.debian-compatible /usr/local/bin/fs_cli && rm fs_cli_${{ steps.version.outputs.version }}_amd64.debian-compatible

          # For ARM64 (aarch64)
          wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/fs_cli_${{ steps.version.outputs.version }}_arm64.debian-compatible
          sudo install -m0755 fs_cli_${{ steps.version.outputs.version }}_arm64.debian-compatible /usr/local/bin/fs_cli && rm fs_cli_${{ steps.version.outputs.version }}_arm64.debian-compatible
          ```

          **Windows Usage:**
          Download `fs_cli_${{ steps.version.outputs.version }}_amd64.windows.exe` and run directly.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
